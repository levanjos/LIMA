<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas</title>
</head>
<body>

     <!-- <ul> </ul>  Como se fosse o bloco sde notas (quando é uma lista NÃO ordenada)-->
     <!-- <li> </li> Representa o item dentro da lista -->

     <!-- ----- LISTAS NÃO ORDENADAS ----- -->
      <ul>
        <li>Salgadinho</li>
        <li>Suco</li>
        <li>Pipoca</li>
        <li>Sucrilhos</li>
        <li>Chocolate</li>
        <li>Refrigerante</li>
        <li>Pão</li>
        <li>Arroz</li>
        <li>Fini</li>
      </ul>


      <!-- ----- LISTAS ORDENADAS ----- -->
       <!-- <ol> </ol> (order list, por isso o ol)-->

       <ol>
        <li>Jonata</li>
        <li>Gabrielzão</li>
        <li>Brayan</li>
       </ol>

       <!-- ----- LISTAS ANINHADAS ----- -->
        <ul>
            <li>Frutas</li>
            <ul>
                <li>Maçã</li>
                <li>Limão</li>
                <li>Banana</li>
            </ul>

            <li>Bebidas</li>
            <ul>
                <li>Coca-Cola</li>
                <li>Água</li>
                <li>Monster</li>
            </ul>
        </ul>

</body>
</html>
