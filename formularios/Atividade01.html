<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 1</title>
</head>
<body>
    
<form>

    <label for="nome">Nome:</label>
    <input type="text" name="nome" placeholder="Informe seu primeiro nome:" required>
    
    <label for="sobrenome">Sobrenome:</label>
    <input type="text" name="sobrenome" placeholder="Informe seu sobrenome:">

    <label for="email">E-mail</label>
    <input type="email" name="email" placeholder="Informe seu e-mail:">

    <label for="senha">Senha</label>
    <input type="password" name="senha" placeholder="Informe sua senha:" required>

    <label for="endereco">Endereço</label>
    <input type="text" name="endereco" placeholder="Informe seu endereço:">
    
    <label for="numero">Número da casa</label>
    <input type="number" name="numero" placeholder="Informe o número da casa:">

    <p>Quer receber informações?</p>
    <label><input type="radio" name="info">Sim</label>
    <label><input type="radio" name="info">Não</label>

    <p>Aceita os termos:</p>
    <label><input type="checkbox" name="termos" required>Termo de uso</label>
    <label><input type="checkbox" name="termos" required>Termo de Direito</label>

    <button type="submit">Enviar</button>

</form>

</body>
</html>
